# PostgreSQL only: every Thecore gem and host app targets Postgres exclusively (and uses
# Postgres-specific SQL), so the dummy app never runs on SQLite. When DATABASE_URL is set,
# config/boot.rb rewrites its database name to thecore_backend_commons_<env>.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST", "db") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV.fetch("PGPASSWORD", "postgres") %>

development:
  <<: *default
  database: thecore_backend_commons_development

test:
  <<: *default
  database: thecore_backend_commons_test

production:
  <<: *default
  database: thecore_backend_commons_production
